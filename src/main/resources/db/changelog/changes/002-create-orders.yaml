databaseChangeLog:
  - changeSet:
      id: 002-create-orders
      author: author
      changes:
        - createTable:
            tableName: orders
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column: { name: name, type: varchar(255), constraints: { nullable: false } }
              - column: { name: source, type: varchar(255), constraints: { nullable: false } }
              - column: { name: destination, type: varchar(255), constraints: { nullable: false } }
              - column: { name: partner_id, type: uuid }
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints: { nullable: false }
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints: { nullable: false }

        - addForeignKeyConstraint:
            baseTableName: orders
            baseColumnNames: partner_id
            referencedTableName: partners
            referencedColumnNames: id
            constraintName: fk_orders_partner
            onDelete: SET NULL