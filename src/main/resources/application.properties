spring.application.name=order-service
server.port=8081
repository.type=jpa

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
openapi.contact.name=Jeexike
openapi.contact.email=dima@rozanov.org

github.api.base-url=https://api.github.com
github.api.token=${GITHUB_API_TOKEN:}

tracking.thread-pool-size=5
tracking.repo-check-rate-ms=3600000
tracking.outbox.dispatch-rate-ms=10000
tracking.outbox.batch-size=100
tracking.outbox.topic=order.link.changed

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all

spring.autoconfigure.exclude=io.github.resilience4j.springboot3.verifier.autoconfigure.SpringBoot3VerifierAutoConfiguration

# ========== Circuit Breaker ==========
resilience4j.circuitbreaker.instances.gitHubApi.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.gitHubApi.sliding-window-size=10
resilience4j.circuitbreaker.instances.gitHubApi.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.gitHubApi.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.gitHubApi.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.instances.gitHubApi.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.gitHubApi.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.gitHubApi.record-exceptions=org.springframework.web.client.ResourceAccessException,org.springframework.web.client.HttpServerErrorException
resilience4j.circuitbreaker.instances.gitHubApi.ignore-exceptions=org.springframework.web.client.HttpClientErrorException,io.github.resilience4j.ratelimiter.RequestNotPermitted

# ========== Rate Limiter ==========
resilience4j.ratelimiter.instances.gitHubApi.limit-for-period=10
resilience4j.ratelimiter.instances.gitHubApi.limit-refresh-period=1s
resilience4j.ratelimiter.instances.gitHubApi.timeout-duration=0s
resilience4j.ratelimiter.instances.gitHubApi.register-health-indicator=true

# ========== Retry ==========
resilience4j.retry.instances.gitHubApi.max-attempts=3
resilience4j.retry.instances.gitHubApi.wait-duration=1s
resilience4j.retry.instances.gitHubApi.enable-exponential-backoff=true
resilience4j.retry.instances.gitHubApi.exponential-backoff-multiplier=2
resilience4j.retry.instances.gitHubApi.retry-exceptions=org.springframework.web.client.ResourceAccessException,org.springframework.web.client.HttpServerErrorException
resilience4j.retry.instances.gitHubApi.ignore-exceptions=org.springframework.web.client.HttpClientErrorException,io.github.resilience4j.ratelimiter.RequestNotPermitted

spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yaml
spring.jpa.hibernate.ddl-auto=validate